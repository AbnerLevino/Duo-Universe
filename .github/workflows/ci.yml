name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o CI só lê o repositório
permissions:
  contents: read

# Um push novo cancela a execução anterior da mesma branch (poupa a cota gratuita)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Postgres descartável, só existe durante este job. A senha abaixo NÃO é um segredo real.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duo_app
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: duo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duo_app -d duo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DUO_APP_DB_PASSWORD: ci-only-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # build = spotlessCheck + compilação + testes (inclui ArchUnit)
      - run: ./gradlew build --console=plain

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

# Testes usam um banco separado para nunca tocar nos dados de desenvolvimento
spring.datasource.url=${DUO_TEST_DB_URL:jdbc:postgresql://localhost:5432/duo_test}

# Segredo só de teste (não é um segredo real)
duo.jwt.secret=segredo-de-teste-com-mais-de-32-caracteres-123456
duo.frontend-url=http://frontend.test

# Fotos dos testes vão para a pasta temporária, nunca para a de desenvolvimento
duo.media.dir=${java.io.tmpdir}/duo-media-test

# Os testes antigos da camada social continuam rodando contra ela ligada (RF-A11); o congelamento é testado à parte.
duo.features.social.enabled=true

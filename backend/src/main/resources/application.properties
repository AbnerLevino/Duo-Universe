spring.application.name=duo-backend

# Banco: credenciais vêm de variáveis de ambiente, nunca do repositório (regra 11)
spring.datasource.url=${DUO_DB_URL:jdbc:postgresql://localhost:5432/duo}
spring.datasource.username=${DUO_DB_USER:duo_app}
spring.datasource.password=${DUO_APP_DB_PASSWORD}

# O schema é do Flyway; o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator: só o necessário
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Login com Google (DEC-030). Id e secret vêm do ambiente, nunca do repositório (regra 11).
# Os valores padrão existem só para a aplicação e os testes subirem sem credenciais.
spring.security.oauth2.client.registration.google.client-id=${DUO_GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${DUO_GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

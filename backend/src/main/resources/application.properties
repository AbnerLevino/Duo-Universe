spring.application.name=duo-backend

# Banco: credenciais vêm de variáveis de ambiente, nunca do repositório (regra 11)
spring.datasource.url=${DUO_DB_URL:jdbc:postgresql://localhost:5432/duo}
spring.datasource.username=${DUO_DB_USER:duo_app}
spring.datasource.password=${DUO_APP_DB_PASSWORD}

# O schema é do Flyway; o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator: só o necessário
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Login com Google (DEC-030). Id e secret vêm do ambiente, nunca do repositório (regra 11).
# Os valores padrão existem só para a aplicação e os testes subirem sem credenciais.
spring.security.oauth2.client.registration.google.client-id=${DUO_GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${DUO_GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Sessão própria (RA-04). O segredo do JWT (mínimo de 32 caracteres) vem do ambiente, nunca do repositório (regra 11).
duo.jwt.secret=${DUO_JWT_SECRET}
# Cookie do token de renovação: Secure ligado; só desligar em desenvolvimento sem HTTPS.
duo.auth.cookie-secure=${DUO_COOKIE_SECURE:true}
# Para onde o login com Google devolve a pessoa (o frontend).
duo.frontend-url=${DUO_FRONTEND_URL:http://localhost:5173}

# Fotos (Épico 3). O arquivo mora numa pasta fora do repositório (armazenamento local de desenvolvimento, DEC-021).
duo.media.dir=${DUO_MEDIA_DIR:${user.home}/duo-media}
# Limites provisórios do Personal até a Q-20 completa: 200 fotos e 100 MB por pessoa.
duo.media.max-photos=200
duo.media.max-total-bytes=104857600
# Foto de até 2 MB por arquivo (o avatar tem limite próprio, de 1 MB, conferido no serviço).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
